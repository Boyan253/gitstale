[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitstale"
version = "0.1.0"
description = "List git branches that are already merged or have gone quiet, and delete them safely."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/gitstale"

[project.scripts]
gitstale = "gitstale:main"

[tool.setuptools]
py-modules = ["gitstale"]
